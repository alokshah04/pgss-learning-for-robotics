<head>

  <title>Weeks 4–5: Project & Paper — Learning for Robotics</title>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #2563eb;
      --border: #e0e0e0;
      --card-bg: #fff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 16px;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header, main, footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding-top: 48px;
      padding-bottom: 36px;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding-left: 21px;
    }

    .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .breadcrumb a { color: var(--muted); }
    .breadcrumb a:hover { color: var(--accent); }

    .week-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.25;
    }

    main { padding-top: 48px; padding-bottom: 80px; }

    footer {
      padding-top: 32px;
      padding-bottom: 48px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .md-body h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.01em;
      margin-top: 48px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .md-body h3 { font-size: 16px; font-weight: 600; margin-top: 28px; margin-bottom: 8px; }
    .md-body p { margin-bottom: 14px; }
    .md-body ul, .md-body ol { padding-left: 20px; margin-bottom: 14px; }
    .md-body li { margin-bottom: 4px; }

    .md-body code {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      background: #f0f0f0;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .md-body pre {
      background: #f4f4f4;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .md-body pre code { background: none; padding: 0; font-size: 13px; }
    .md-body blockquote { border-left: 3px solid var(--accent); margin: 0 0 14px 0; padding: 8px 16px; color: var(--muted); }
    .md-body a { color: var(--accent); }
    .md-body strong { font-weight: 600; }

    .md-body table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
    .md-body th, .md-body td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .md-body th { font-weight: 600; }

    .resource-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }

    .resource-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      text-decoration: none;
      transition: border-color .12s, color .12s;
    }

    .resource-btn:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  </style>
</head>
